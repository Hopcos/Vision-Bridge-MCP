[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-bridge-mcp-server"
version = "0.1.0"
description = "为纯文本 LLM 补上视觉能力的 MCP Server：把图片转换为文字描述，让不支持图片的强模型也能『看懂』截图、UI 设计稿、图表和错误信息。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vision-bridge" }]
keywords = ["mcp", "model-context-protocol", "vision", "ocr", "llm", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
paddleocr = [
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
]
tesseract = [
    "pytesseract>=0.3.10",
]
mcp-http = [
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]
all = [
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
    "pytesseract>=0.3.10",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mcp-http",
]

[project.scripts]
vision-bridge-mcp-server = "vision_bridge.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/vision-bridge-mcp-server"
Source = "https://github.com/your-org/vision-bridge-mcp-server"
Issues = "https://github.com/your-org/vision-bridge-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "LICENSE",
    ".env.example",
    "Dockerfile",
    "docker-compose.yml",
    "src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
